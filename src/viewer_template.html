<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRRRCast-TX Viewer</title>
<script>
// Colours follow the computer's light / dark setting unless the viewer picked the other one
// with the title-bar button (remembered in this browser). Picking the same as the computer
// again clears the override, so the page goes back to following the system setting.
var HRRRCAST_THEME = (function(){
  var root = document.documentElement, KEY = "hrrrcast-theme";
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
  var system = function(){ return mq && mq.matches ? "light" : "dark"; };
  var saved = function(){ try { var v = localStorage.getItem(KEY); return v === "light" || v === "dark" ? v : null; } catch(e) { return null; } };
  var listeners = [];
  var apply = function(){ root.setAttribute("data-theme", saved() || system()); listeners.forEach(function(f){ f(); }); };
  apply();                                            // before first paint
  if (mq){ if (mq.addEventListener) mq.addEventListener("change", apply); else if (mq.addListener) mq.addListener(apply); }
  return {
    toggle: function(){
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      try { if (next === system()) localStorage.removeItem(KEY); else localStorage.setItem(KEY, next); } catch(e) {}
      root.setAttribute("data-theme", next); listeners.forEach(function(f){ f(); });
    },
    onChange: function(f){ listeners.push(f); f(); }
  };
})();
// title-bar logos: logos/<name>.svg, else .png / .webp / .jpg, else the logo is hidden
function logoFallback(img){
  var exts = ["svg", "png", "webp", "jpg"], m = img.src.match(/\.(\w+)$/),
      i = m ? exts.indexOf(m[1].toLowerCase()) : -1;
  if (i >= 0 && i < exts.length - 1) img.src = img.src.replace(/\.\w+$/, "." + exts[i + 1]);
  else img.parentNode.remove();
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Roboto+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout after the classic NWP model-page pattern: maroon title bar, product list on the
   left, forecast-hour strip across the top of the maps, square boxed panels. */
:root{
  --maroon:#500000; --bar-ink:#f3ece4;
  --bg:#161616; --panel:#202020; --panel2:#2b2b2b; --line:#3e3e3e; --text:#e6e6e6; --muted:#9b9b9b;
  --accent:#b8473f; --accent-ink:#ffffff; --hot:#d9b45a; color-scheme:dark;
  --sans:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --mono:"IBM Plex Mono",Consolas,"Liberation Mono",monospace;
}
:root[data-theme="light"]{
  --bg:#d6d5d0; --panel:#ffffff; --panel2:#ecebe6; --line:#a8a7a1; --text:#141414; --muted:#55544f;
  --accent:#500000; --accent-ink:#ffffff; --hot:#8a5a00; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.3 var(--sans);
  display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
button,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);
  border-radius:0;padding:3px 7px}
button{cursor:pointer}
button:hover:not(:disabled),select:hover{border-color:var(--text)}
button:disabled{opacity:.45;cursor:default}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* title bar */
#top{grid-column:1/-1;background:var(--maroon);color:var(--bar-ink);display:flex;align-items:center;
  gap:22px;padding:0 0 0 16px;min-height:64px;border-bottom:4px solid #2c0000}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.logos{display:flex;align-items:center;gap:16px;align-self:stretch;padding:8px 0}
.logos a{display:flex;align-items:center;height:100%}
.logos img{display:block;height:44px;width:auto}
.logos a + a{padding-left:16px;border-left:1px solid rgba(255,255,255,.3)}
.brand{flex-direction:column;align-items:flex-start;gap:1px}
.brand .mark{font-weight:700;font-size:28px;letter-spacing:.6px;line-height:1.05}
.brand .sub{font-size:12.5px;opacity:.8;text-transform:uppercase;letter-spacing:1px}
#time{margin-left:auto;font:15px var(--mono);white-space:nowrap}
#theme{background:transparent;color:var(--bar-ink);border:0;border-left:1px solid rgba(255,255,255,.25);
  align-self:stretch;padding:0 18px;font-size:12.5px;text-transform:uppercase;letter-spacing:.8px}
#theme:hover{background:rgba(255,255,255,.08)}
#time b{font-weight:600;color:#fff}

/* left column */
#side{background:var(--panel2);border-right:1px solid var(--line);overflow-y:auto;padding-bottom:10px}
#side section{padding:8px 10px 10px;border-bottom:1px solid var(--line)}
#side h2{margin:0 0 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;
  color:var(--muted);display:flex;justify-content:space-between;align-items:center}
#side select{width:100%}
#field{height:17.5em;padding:0;background:var(--panel)}
#field:focus,#field:focus-visible{outline:none;border-color:var(--line)}
#field option{padding:2px 6px;color:var(--text);text-transform:none;font-weight:400;font-size:13px}
#field optgroup{font-style:normal;font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase}
#field option:checked{background:var(--accent) linear-gradient(var(--accent),var(--accent));color:var(--accent-ink)}
.row{display:flex;align-items:center;gap:6px;margin-top:6px}
.row label{color:var(--muted);min-width:52px}
.row select{flex:1}
.link{background:none;border:0;padding:0;color:var(--accent);font-size:11px;text-transform:uppercase;
  letter-spacing:1px;font-weight:700}
:root[data-theme="dark"] .link{color:var(--hot)}
.link:hover{text-decoration:underline}
.links{display:flex;gap:12px}
.pick{grid-column:1/-1;color:var(--muted);padding:40px 10px;font-size:13px}
#members{display:grid;grid-template-columns:1fr 1fr;gap:0}
.chip{display:flex;align-items:center;gap:6px;background:none;border:0;padding:3px 2px;text-align:left;
  white-space:nowrap}
.chip::before{content:"";flex:none;width:10px;height:10px;border:1px solid var(--muted);background:var(--panel)}
.chip.on{background:none;color:var(--text)}
.chip.on::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--panel)}
.chip:hover{text-decoration:underline}
.help dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px;color:var(--muted)}
.help dt{font-family:var(--mono);font-size:11px;color:var(--text)}
.help dd{margin:0}
#gen{margin:8px 0 0;font:11px var(--mono);color:var(--muted)}

/* forecast-hour bar */
main{overflow-y:auto;min-width:0;display:flex;flex-direction:column}
#bar{position:sticky;top:0;z-index:4;background:var(--panel2);border-bottom:1px solid var(--line);
  display:flex;align-items:stretch;gap:8px;padding:6px 10px}
.ctrls{display:flex;flex:none}
.ctrls > *{margin-left:-1px}
#play{min-width:56px;font-weight:600}
#hours{display:flex;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin}
#hours button{flex:none;min-width:36px;margin-left:-1px;padding:3px 4px;font:11px var(--mono);text-align:center}
#hours button.d0{border-left:2px solid var(--hot)}
#hours button.on{position:relative;z-index:1}
#load{flex:none;align-self:center;font:11px var(--mono);color:var(--muted);min-width:90px;text-align:right}

/* map panels */
#grid{display:grid;gap:6px;padding:8px 10px 14px}
.cell{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.cell .lbl{padding:3px 8px;font-size:12px;display:flex;justify-content:space-between;gap:8px;
  background:var(--panel2);border-bottom:1px solid var(--line)}
.cell .lbl b{font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:11.5px}
.cell .lbl span{font:11px var(--mono);color:var(--muted)}
.cell .img{position:relative;flex:1;display:flex;align-items:center;justify-content:center;cursor:zoom-in;
  min-height:120px;background:#fff;overflow:hidden}
.cell img{max-width:100%;max-height:calc(100vh - 130px);display:block;object-fit:contain;
  transform-origin:0 0;user-select:none;-webkit-user-drag:none}
#grid.zoomed .cell .img{cursor:grab;touch-action:none}
#grid.zoomed .cell .img.panning{cursor:grabbing}
.cell.focus .img{cursor:zoom-out}
.cell.focus img{max-height:calc(100vh - 110px)}
.missing{color:#666;font:12px var(--mono);padding:30px 10px;text-align:center}
#empty{padding:60px 20px;color:var(--muted);max-width:640px}
#empty code{font-family:var(--mono);background:var(--panel2);padding:1px 5px}

@media (max-width:820px){
  body{display:block;height:auto}
  #top{flex-wrap:wrap;gap:4px 12px;padding:6px 0 6px 12px}
  .brand .sub{display:none}
  #theme{margin-left:auto;align-self:center;padding:6px 12px}
  .logos img{height:32px}
  .brand .mark{font-size:22px}
  .logos a + a{display:none}
  #time{margin-left:0;order:3;flex-basis:100%;font-size:12px;white-space:normal}
  #side{border-right:0;display:grid;grid-template-columns:1fr 1fr}
  #side section{border-right:1px solid var(--line)}
  #side .help{display:none}
  #field{height:9em}
  #bar{flex-wrap:wrap}
  #hours{flex-basis:100%;order:3}
  .cell img{max-height:none}
  #grid{grid-template-columns:minmax(0,1fr) !important}
}
</style>
</head>
<body>
<header id="top">
  <!-- Logos: logos/tamu.* and logos/atmo.* (svg, png, webp or jpg) next to viewer.html;
       make_viewer_index.py copies src/logos/ there. Or change src to a full URL.
       A logo whose file is missing is hidden.
       White / reversed versions read best on the maroon bar. -->
  <div class="logos">
    <a href="https://www.tamu.edu/" title="Texas A&amp;M University"><img src="logos/tamu.svg" alt="Texas A&amp;M University" onerror="logoFallback(this)"></a>
    <a href="https://artsci.tamu.edu/atmospheric-sciences/" title="Department of Atmospheric Sciences"><img src="logos/atmo.svg" alt="Texas A&amp;M Atmospheric Sciences" onerror="logoFallback(this)"></a>
  </div>
  <div class="brand"><span class="mark">HRRRCast-TX</span><span class="sub">experimental ML ensemble &middot; Texas A&amp;M Atmospheric Sciences &middot; based on https://github.com/NOAA-GSL/HRRRCast-live</span></div>
  <div id="time"></div>
  <button id="theme" type="button"></button>
</header>

<aside id="side">
  <section><h2>Run</h2><select id="case" aria-label="Initialization time"></select></section>
  <section id="domainWrap"><h2>Zoom Area</h2><select id="domain" aria-label="Domain"></select></section>
  <section><h2>Product</h2>
    <select id="field" size="14" aria-label="Product"></select>
    <div class="row" id="levelWrap"><label for="level">Level</label><select id="level"></select></div>
  </section>
  <section><h2>Members <span class="links"><button class="link" id="allMem" type="button" title="Show every member">all</button><button class="link" id="noMem" type="button" title="Clear the selection">none</button></span></h2>
    <div id="members"></div></section>
  <section><h2>Display</h2>
    <div class="row"><label for="cols">Columns</label>
      <select id="cols"><option value="auto">auto</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
    <div class="row"><label>Zoom</label>
      <button id="zoomOut" title="Zoom out (−)">−</button><button id="zoomIn" title="Zoom in (+)">+</button>
      <button id="zoomReset" title="Reset zoom (0)" disabled>reset</button></div>
  </section>
  <section class="help"><h2>Keys</h2>
    <dl><dt>← →</dt><dd>forecast hour</dd><dt>space</dt><dd>play / stop</dd><dt>↑ ↓</dt><dd>pressure level</dd>
      <dt>+ − 0</dt><dd>zoom in / out / reset</dd><dt>click</dt><dd>enlarge one map</dd>
      <dt>drag</dt><dd>pan when zoomed</dd></dl>
    <p id="gen"></p></section>
</aside>

<main>
  <div id="bar">
    <div class="ctrls">
      <button id="prev" title="Previous hour (←)">&lsaquo;</button><button id="play" title="Play / stop (space)">Play</button><button id="next" title="Next hour (→)">&rsaquo;</button>
      <select id="speed" aria-label="Loop speed" title="Loop speed"><option value="1200">slow</option><option value="600" selected>normal</option><option value="300">fast</option><option value="150">faster</option></select>
    </div>
    <div id="hours" role="toolbar" aria-label="Forecast hour"></div>
    <span id="load"></span>
    <input type="range" id="slider" min="0" max="0" value="0" hidden>
    <div id="ticks" hidden></div>
  </div>
  <div id="grid"></div>
  <div id="empty" hidden></div>
</main>

<script>
// light / dark button: shows the mode it switches to
(function(){
  const btn = document.getElementById("theme");
  HRRRCAST_THEME.onChange(() => {
    const dark = document.documentElement.dataset.theme === "dark";
    btn.textContent = dark ? "light" : "dark";
    btn.title = dark ? "Switch to light colours" : "Switch to dark colours";
  });
  btn.addEventListener("click", HRRRCAST_THEME.toggle);
})();
</script>
<script>
// load the manifest with a cache-buster so the browser never shows a stale index
document.write('<script src="viewer_manifest.js?t=' + Date.now() + '"><\/script>');
</script>
<script>
(function(){
const M = window.HRRRCAST_MANIFEST;
const $ = id => document.getElementById(id);
const pad2 = n => String(n).padStart(2,"0");

// Products shown first, in this order (anything else follows alphabetically)
const FEATURED = ["REFC","CAPE","PWAT","APCP_TOT","APCP","APCP_6H","APCP_12H",
                  "CIN","T2M","D2M","WIND_10M","GUST","MSLMA","HLCY_0_3km","HLCY_0_1km","VIS","TCDC","summary"];
const NAMES = {
  summary:"Summary panel", REFC:"Composite reflectivity", APCP:"1 hr precip", APCP_TOT:"Total precip",
  APCP_6H:"6 hr precip", APCP_12H:"12 hr precip", CAPE:"CAPE", CIN:"CIN",
  T2M:"2 m temperature", D2M:"2 m dewpoint", R2M:"2 m RH", POT2M:"2 m potential temp", SPFH2M:"2 m specific humidity",
  WIND_10M:"10 m wind", UGRD10M:"10 m U wind", VGRD10M:"10 m V wind", UGRD80M:"80 m U wind", VGRD80M:"80 m V wind",
  GUST:"Wind gust", GUST_CONV:"Convective gust", GUST_FACTOR:"Gust factor", WIND_MAX:"Max wind",
  MSLMA:"MSLP (MAPS)", PRES:"Surface pressure", PWAT:"Precipitable water", VIS:"Visibility",
  TCDC:"Total cloud", LCDC:"Low cloud", MCDC:"Mid cloud", HCDC:"High cloud", HGTCC:"Cloud ceiling",
  HLCY_0_1km:"0–1 km SRH", HLCY_0_3km:"0–3 km SRH", RELV_max_0_1km:"Max rel. vorticity 0–1 km",
  RELV_max_0_2km:"Max rel. vorticity 0–2 km", USTM_0_6km:"Storm motion U", VSTM_0_6km:"Storm motion V",
  VUCSH_0_1km:"0–1 km shear U", VVCSH_0_1km:"0–1 km shear V", VUCSH_0_6km:"0–6 km shear U", VVCSH_0_6km:"0–6 km shear V",
  HGT:"Geopotential height", TMP:"Temperature", UGRD:"U wind", VGRD:"V wind", VVEL:"Vertical velocity", SPFH:"Specific humidity",
  CRAIN:"Categorical rain", CFRZR:"Categorical freezing rain", RAIN_MASK:"Rain mask", FRZR_MASK:"Freezing-rain mask",
  HGT_0C:"0 °C height", RH_0C:"RH at 0 °C", SPFH_0C:"Spec. humidity at 0 °C", UGRD_0C:"U wind at 0 °C",
  VGRD_0C:"V wind at 0 °C", WIND_0C:"Wind at 0 °C", DU_SFC_0C:"ΔU sfc–0 °C", DV_SFC_0C:"ΔV sfc–0 °C",
  SHEAR_SFC_0C:"Shear sfc–0 °C", WARM_LAYER_DEPTH:"Warm layer depth", COLD_LAYER_DEPTH:"Cold layer depth"
};
const memLabel = m => m === "hrrr" ? "HRRR (operational)" : m === "avg" ? "Ensemble mean (PMM for REFC, LPMM for precip)" : m === "lpmm" ? "Local PMM (APCP only)" : m === "spr" ? "Spread" : "Member " + parseInt(m.slice(1),10);
const memShort = m => m === "hrrr" ? "HRRR" : m === "avg" ? "Ens. mean" : m === "lpmm" ? "LPMM" : m === "spr" ? "Spread" : "Mem " + pad2(parseInt(m.slice(1),10));
const panelTitle = m => m === "hrrr" ? "HRRR (operational)" : m === "avg" ? "Ensemble mean" : memLabel(m);

if (!M || !M.cases || !Object.keys(M.cases).length){
  $("bar").hidden = true;
  const e = $("empty"); e.hidden = false;
  e.innerHTML = "No forecast plots indexed yet.<br><br>Run <code>python src/plot.py …</code>, then " +
    "<code>python src/make_viewer_index.py</code> in this folder and reload.";
  return;
}

// ---------- state ----------
const DEFAULT_MEMBERS = ["hrrr", "m00", "avg"];
const S = {case:null, domain:"tx", field:null, level:null, members:new Set(), cleared:false, idx:0, cols:"auto", focus:null, playing:false};
let timer = null, leads = [], cache = {};

function splitProduct(p){
  let m = p.match(/^(.*)_(\d+)hPa$/); if (m) return [m[1], m[2]];
  m = p.match(/^(.*)_surface$/); if (m) return [m[1], "surface"];
  return [p, ""];
}
// manifest: cases[case].domains[domain] = {members, memdirs, leads, products, prefix}
// (older manifests have no "domains": the case object itself is the single domain)
const DOMAIN_NAMES = {tx:"Texas (full grid)", hcfcd_hrrr:"HCFCD (HRRR)", hcfcd_href:"HCFCD (HREF)", texas:"Texas", hcfcd:"HCFCD (Harris Co.)"};   // hcfcd = folder name before the rename
// own-key lookup only: values from the URL (#c=..., #p=...) must never resolve to
// inherited properties such as "__proto__" or "constructor"
const own = (o, k) => o != null && Object.prototype.hasOwnProperty.call(o, k);
const domainsOf = k => M.cases[k].domains || {tx: M.cases[k]};
function caseObj(){ const d = domainsOf(S.case); return own(d, S.domain) ? d[S.domain] : d[Object.keys(d)[0]]; }
function fieldsOf(c){
  const f = {};
  for (const p of Object.keys(c.products)){ const [v,l] = splitProduct(p); (f[v] ||= []).push(l); }
  for (const v in f) f[v].sort((a,b)=> (a==="surface"?-1:b==="surface"?1:(+b)-(+a)));  // surface, then 1000→200 hPa
  return f;
}
function productKey(){ return S.level === "" ? S.field : S.level === "surface" ? S.field+"_surface" : `${S.field}_${S.level}hPa`; }
function imgPath(mem, lead){
  const c = caseObj(), d = c.memdirs[mem];
  return `${M.image_base || ""}${S.case}/${c.prefix || ""}${d}_lead${pad2(lead)}h/${productKey()}_lead${pad2(lead)}h.png`;
}
function hasImg(mem, lead){
  const p = caseObj().products[productKey()]; return !!(p && p[mem] && p[mem].includes(lead));
}
function initDate(){ const [d,h] = S.case.split("/"); return new Date(Date.UTC(+d.slice(0,4), +d.slice(4,6)-1, +d.slice(6), +h)); }

// ---------- controls ----------
function fillCases(){
  const sel = $("case"); sel.innerHTML = "";
  const keys = Object.keys(M.cases).sort().reverse();
  for (const k of keys){
    const [d,h] = k.split("/");
    sel.add(new Option(`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)} ${h}Z`, k));
  }
}
function fillDomains(){
  const doms = Object.keys(domainsOf(S.case)), sel = $("domain"); sel.innerHTML = "";
  doms.sort((a,b) => (a==="tx" ? -1 : b==="tx" ? 1 : a.localeCompare(b)));
  for (const d of doms) sel.add(new Option(DOMAIN_NAMES[d] || d.toUpperCase(), d));
  if (!doms.includes(S.domain)) S.domain = doms[0];
  sel.value = S.domain;
  $("domainWrap").style.display = doms.length > 1 ? "" : "none";
}
function fillFields(){
  const f = fieldsOf(caseObj()), sel = $("field"); sel.innerHTML = "";
  const names = Object.keys(f);
  const feat = FEATURED.filter(n => f[n]);
  const upper = names.filter(n => !feat.includes(n) && f[n].some(l => /^\d+$/.test(l))).sort();
  const sfc = names.filter(n => !feat.includes(n) && !upper.includes(n)).sort();
  const grp = (label, list) => {
    if (!list.length) return; const g = document.createElement("optgroup"); g.label = label;
    for (const n of list){ const o = new Option(NAMES[n] || n, n); o.title = n; g.appendChild(o); }
    sel.appendChild(g);
  };
  for (const n of feat){ const o = new Option(NAMES[n] || n, n); o.title = n; sel.appendChild(o); }   // main products, no header
  grp("Surface & derived", sfc); grp("Upper air", upper);
  if (!own(f, S.field)) S.field = feat[0] || names[0];
  sel.value = S.field;
}
function fillLevels(){
  const fl = fieldsOf(caseObj()), lv = own(fl, S.field) ? fl[S.field] : [""], sel = $("level"); sel.innerHTML = "";
  for (const l of lv) sel.add(new Option(l === "surface" ? "surface" : l === "" ? "—" : l + " hPa", l));
  if (!lv.includes(S.level)) S.level = lv.includes("500") ? "500" : lv[0];
  sel.value = S.level;
  $("levelWrap").style.display = lv.length > 1 ? "" : "none";
}
function fillMembers(){
  const c = caseObj(), box = $("members"); box.innerHTML = "";
  const avail = c.members;
  // default: HRRR, member 0 and the ensemble mean only (fewer images to load); "all" shows the rest
  // (an empty selection made with "none" or by unticking everything is kept as is)
  if (!S.cleared && ![...S.members].some(m => avail.includes(m))) {
    const d = DEFAULT_MEMBERS.filter(m => avail.includes(m));
    S.members = new Set(d.length ? d : avail.slice(0, 1));
  }
  for (const m of avail){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (S.members.has(m) ? " on" : "");
    b.textContent = memShort(m);
    b.title = memLabel(m);
    b.setAttribute("aria-pressed", S.members.has(m) ? "true" : "false");
    b.onclick = () => { S.members.has(m) ? S.members.delete(m) : S.members.add(m);
                        S.cleared = !S.members.size; S.focus = null; refresh(); };
    box.appendChild(b);
  }
}
function computeLeads(){
  const p = caseObj().products[productKey()] || {};
  const set = new Set();
  for (const m of S.members) (p[m] || []).forEach(l => set.add(l));
  const cur = leads[S.idx];
  leads = [...set].sort((a,b)=>a-b);
  if (!leads.length) leads = caseObj().leads.slice();
  S.idx = Math.max(0, leads.indexOf(cur));
  const sl = $("slider"); sl.max = Math.max(0, leads.length - 1); sl.value = S.idx;
  // forecast-hour strip; a gold left edge marks the first hour of each new (UTC) valid day
  const box = $("hours"), t0 = initDate().getTime(); box.innerHTML = "";
  leads.forEach((l, i) => {
    const b = document.createElement("button"), v = new Date(t0 + l * 3600e3);
    b.type = "button"; b.textContent = pad2(l);
    b.title = `f${pad2(l)} · valid ${v.toLocaleDateString("en-US",{weekday:"short", timeZone:"UTC"})} ${pad2(v.getUTCHours())}Z`;
    if (i > 0 && v.getUTCHours() < (new Date(t0 + leads[i-1] * 3600e3)).getUTCHours()) b.className = "d0";
    b.onclick = () => { play(false); S.idx = i; draw(); writeHash(); };
    box.appendChild(b);
  });
}

// ---------- zoom (shared by all panels, kept while stepping/looping) ----------
// translate in % of the image box, then scale; % keeps panels of different sizes in sync
const Z = {s:1, tx:0, ty:0}, ZMAX = 8;
let panMoved = false;
function applyZoom(){
  Z.s = Math.min(ZMAX, Math.max(1, Z.s));
  const lo = 100 * (1 - Z.s);                       // keep the image covering its box
  Z.tx = Math.min(0, Math.max(lo, Z.tx)); Z.ty = Math.min(0, Math.max(lo, Z.ty));
  if (Z.s === 1){ Z.tx = 0; Z.ty = 0; }
  const t = Z.s === 1 ? "" : `translate(${Z.tx}%,${Z.ty}%) scale(${Z.s})`;
  for (const im of $("grid").querySelectorAll(".cell img")) im.style.transform = t;
  $("grid").classList.toggle("zoomed", Z.s > 1);
  $("zoomReset").disabled = Z.s === 1;
}
function boxOf(img){                                  // untransformed image box
  const r = img.getBoundingClientRect(), W = r.width / Z.s, H = r.height / Z.s;
  return {r, W, H, left: r.left - Z.tx * W / 100, top: r.top - Z.ty * H / 100};
}
function zoomAt(img, cx, cy, factor){                 // keep the point under (cx, cy) fixed
  const b = boxOf(img); if (!b.W) return;
  const u = (cx - b.r.left) / b.r.width, v = (cy - b.r.top) / b.r.height;
  const fx = (cx - b.left) / b.W, fy = (cy - b.top) / b.H;
  const s2 = Math.min(ZMAX, Math.max(1, Z.s * factor));
  Z.tx = 100 * (fx - s2 * u); Z.ty = 100 * (fy - s2 * v); Z.s = s2; applyZoom();
}
function zoomCenter(factor){
  const img = [...$("grid").querySelectorAll(".cell img")].find(im => !im.hidden && im.naturalWidth);
  if (!img) return;
  const b = boxOf(img); zoomAt(img, b.left + b.W / 2, b.top + b.H / 2, factor);
}
function resetZoom(){ Z.s = 1; applyZoom(); }
function wireZoom(box, img){
  // ctrl+wheel (also a trackpad pinch) zooms; plain wheel zooms only when already zoomed or
  // on a single enlarged map, so the page still scrolls normally over the grid
  box.addEventListener("wheel", e => {
    if (img.hidden || !(e.ctrlKey || e.metaKey || Z.s > 1 || S.focus)) return;
    e.preventDefault();
    zoomAt(img, e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002)));
  }, {passive:false});
  let drag = null;
  box.addEventListener("pointerdown", e => {
    if (Z.s === 1 || e.button !== 0 || img.hidden) return;
    const b = boxOf(img);
    drag = {x:e.clientX, y:e.clientY, tx:Z.tx, ty:Z.ty, W:b.W, H:b.H};
    panMoved = false; box.setPointerCapture(e.pointerId); box.classList.add("panning");
  });
  box.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) panMoved = true;
    Z.tx = drag.tx + 100 * dx / drag.W; Z.ty = drag.ty + 100 * dy / drag.H; applyZoom();
  });
  const end = () => { drag = null; box.classList.remove("panning"); };
  box.addEventListener("pointerup", end); box.addEventListener("pointercancel", end);
}

// ---------- grid ----------
let cells = {};
function buildGrid(){
  const g = $("grid"); g.innerHTML = ""; cells = {};
  const mems = caseObj().members.filter(m => S.members.has(m));
  const shown = S.focus && mems.includes(S.focus) ? [S.focus] : mems;
  let cols = S.cols === "auto" ? Math.min(shown.length, shown.length <= 4 ? shown.length : shown.length <= 6 ? 3 : 4) : +S.cols;
  if (S.focus) cols = 1;
  g.style.gridTemplateColumns = `repeat(${Math.max(1,cols)}, minmax(0,1fr))`;
  if (!shown.length){ g.innerHTML = '<div class="pick">No members selected &mdash; tick one or more under Members.</div>'; }
  for (const m of shown){
    const cell = document.createElement("div"); cell.className = "cell" + (S.focus ? " focus" : "");
    cell.innerHTML = `<div class="lbl"><b></b><span></span></div><div class="img"><img alt=""><div class="missing" hidden>not available</div></div>`;
    cell.querySelector(".lbl b").textContent = panelTitle(m);
    cell.querySelector(".lbl b").title = memLabel(m);
    const box = cell.querySelector(".img");
    box.onclick = () => {                            // a drag (pan) is not a click
      if (panMoved){ panMoved = false; return; }
      S.focus = S.focus ? null : m; buildGrid(); draw(); writeHash();
    };
    wireZoom(box, cell.querySelector("img"));
    g.appendChild(cell); cells[m] = cell;
  }
  applyZoom();
}
function draw(){
  const lead = leads[S.idx];
  for (const m in cells){
    const cell = cells[m], img = cell.querySelector("img"), miss = cell.querySelector(".missing");
    const ok = hasImg(m, lead);
    cell.querySelector(".lbl span").textContent = "F" + pad2(lead);
    if (ok){
      const src = imgPath(m, lead);
      if (img.getAttribute("src") !== src){
        img.onerror = () => { img.hidden = true; miss.hidden = false;
          miss.textContent = "image missing: " + src + " (re-run make_viewer_index.py?)"; };
        img.src = src;
      }
      img.hidden = false; miss.hidden = true; miss.textContent = "not available";
    }
    else { img.hidden = true; miss.hidden = false; }
  }
  $("slider").value = S.idx;
  const hb = $("hours").children;
  for (let i = 0; i < hb.length; i++) hb[i].classList.toggle("on", i === S.idx);
  const cur = hb[S.idx];
  if (cur){                                          // keep the current hour in view (strip only)
    const strip = $("hours"), l = cur.offsetLeft - strip.offsetLeft, r = l + cur.offsetWidth;
    if (l < strip.scrollLeft) strip.scrollLeft = l - 20;
    else if (r > strip.scrollLeft + strip.clientWidth) strip.scrollLeft = r - strip.clientWidth + 20;
  }
  const init = initDate();
  const valid = new Date(init.getTime() + lead*3600e3);
  const fmt = t => `${t.getUTCFullYear()}-${pad2(t.getUTCMonth()+1)}-${pad2(t.getUTCDate())} ${pad2(t.getUTCHours())}Z`;
  const wd = valid.toLocaleDateString("en-US",{weekday:"short", timeZone:"UTC"});
  $("time").innerHTML = `INIT ${fmt(init)} &nbsp;&nbsp; <b>F${pad2(lead)}</b> &nbsp; VALID <b>${wd} ${fmt(valid)}</b>`;
}
function preload(){
  const want = [];
  for (const m of S.members) for (const l of leads) if (hasImg(m,l)) want.push(imgPath(m,l));
  let done = 0; const total = want.length, el = $("load");
  const tick = () => { el.textContent = done >= total ? "" : `loading ${done}/${total}`; };
  tick();
  for (const src of want){
    if (cache[src] && cache[src].complete){ done++; tick(); continue; }
    const im = cache[src] || (cache[src] = new Image());
    const fin = () => { done++; tick(); };
    im.addEventListener("load", fin, {once:true}); im.addEventListener("error", fin, {once:true});
    if (!im.src) im.src = src;
  }
}

// ---------- playback ----------
// arrow keys / buttons stop at the first and last forecast hour; only Play loops around
function step(d, wrap){
  if (!leads.length) return;
  S.idx = wrap ? (S.idx + d + leads.length) % leads.length : Math.min(leads.length - 1, Math.max(0, S.idx + d));
  draw(); writeHash();
}
function play(on){
  S.playing = on; $("play").textContent = on ? "Stop" : "Play"; $("play").classList.toggle("on", on);
  clearTimeout(timer);
  if (!on) return;
  const loop = () => {
    step(1, true);
    const ms = +$("speed").value * (S.idx === leads.length - 1 ? 2.5 : 1);   // dwell on last frame
    timer = setTimeout(loop, ms);
  };
  timer = setTimeout(loop, +$("speed").value);
}

// ---------- URL state ----------
function writeHash(){
  const q = new URLSearchParams({c:S.case, d:S.domain, p:S.field, l:S.level, m:[...S.members].join(","), f:leads[S.idx] ?? "", cols:S.cols});
  if (S.focus) q.set("z", S.focus);
  history.replaceState(null, "", "#" + q.toString());
}
function readHash(){
  const q = new URLSearchParams(location.hash.slice(1));
  if (own(M.cases, q.get("c"))) S.case = q.get("c");
  if (q.get("d")) S.domain = q.get("d");
  if (q.has("p")) S.field = q.get("p");
  if (q.has("l")) S.level = q.get("l");
  if (q.get("m")) S.members = new Set(q.get("m").split(","));
  if ([...$("cols").options].some(o => o.value === q.get("cols"))) S.cols = q.get("cols");
  if (q.get("z")) S.focus = q.get("z");
  return q.has("f") ? +q.get("f") : null;
}

// ---------- wiring ----------
function refresh(rebuildFields){
  if (rebuildFields){ fillDomains(); fillFields(); }
  fillLevels(); fillMembers(); computeLeads(); buildGrid(); draw(); preload(); writeHash();
}
$("case").onchange = e => { S.case = e.target.value; S.focus = null; resetZoom(); refresh(true); };
$("domain").onchange = e => { S.domain = e.target.value; S.focus = null; resetZoom(); refresh(true); };
$("zoomIn").onclick = () => zoomCenter(1.5);
$("zoomOut").onclick = () => zoomCenter(1 / 1.5);
$("zoomReset").onclick = resetZoom;
$("field").onchange = e => { S.field = e.target.value; refresh(); };
$("level").onchange = e => { S.level = e.target.value; refresh(); };
$("cols").onchange = e => { S.cols = e.target.value; buildGrid(); draw(); writeHash(); };
$("allMem").onclick = () => { S.members = new Set(caseObj().members); S.cleared = false; S.focus = null; refresh(); };
$("noMem").onclick = () => { play(false); S.members = new Set(); S.cleared = true; S.focus = null; refresh(); };
$("slider").oninput = e => { S.idx = +e.target.value; draw(); writeHash(); };
$("prev").onclick = () => { play(false); step(-1); };
$("next").onclick = () => { play(false); step(1); };
$("play").onclick = () => play(!S.playing);
$("speed").onchange = () => { if (S.playing) play(true); };
document.addEventListener("keydown", e => {
  // in a drop-down or the product list, keep its own keys except left/right (forecast hour)
  if (e.target.tagName === "SELECT" && e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if (e.key === "ArrowRight"){ play(false); step(1); e.preventDefault(); }
  else if (e.key === "ArrowLeft"){ play(false); step(-1); e.preventDefault(); }
  else if (e.key === " "){ play(!S.playing); e.preventDefault(); }
  else if (e.key === "Home"){ S.idx = 0; draw(); }
  else if (e.key === "End"){ S.idx = leads.length - 1; draw(); }
  else if (e.key === "+" || e.key === "="){ zoomCenter(1.5); e.preventDefault(); }
  else if (e.key === "-" || e.key === "_"){ zoomCenter(1 / 1.5); e.preventDefault(); }
  else if (e.key === "0"){ resetZoom(); }
  else if (e.key === "Escape" && Z.s > 1){ resetZoom(); }
  else if (e.key === "Escape" && S.focus){ S.focus = null; buildGrid(); draw(); writeHash(); }
  else if ((e.key === "ArrowUp" || e.key === "ArrowDown") && $("levelWrap").style.display !== "none"){
    const sel = $("level"), i = sel.selectedIndex + (e.key === "ArrowUp" ? 1 : -1);   // up = higher in atmosphere
    if (i >= 0 && i < sel.options.length){ S.level = sel.options[i].value; refresh(); }
    e.preventDefault();
  }
});

$("gen").textContent = "index built " + (M.generated || "?");
fillCases();
const startLead = readHash();
S.case = S.case || $("case").options[0].value;
$("case").value = S.case; $("cols").value = S.cols;
fillDomains(); fillFields(); fillLevels(); fillMembers(); computeLeads();
if (startLead !== null && leads.includes(startLead)) S.idx = leads.indexOf(startLead);
buildGrid(); draw(); preload(); writeHash();
})();
</script>
</body>
</html>
