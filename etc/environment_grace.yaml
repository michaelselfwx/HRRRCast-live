# HRRRCast environment for TAMU HPRC Grace (A100/A40 GPUs).
#
# TensorFlow + Keras come from pip ONLY, pinned to the versions the model was saved with
# (Keras 2 format, TF 2.15). conda must never install its own tensorflow/keras here: on a
# login node conda-forge picks the CPU build, and mixing conda + pip TF breaks imports.
#
# Build (on a login node is fine):
#   conda env create -f etc/environment_grace.yaml
#   conda activate hrrrcast
#   printf "tensorflow <0\nkeras <0\n" >> $CONDA_PREFIX/conda-meta/pinned
# Check (on a GPU node):
#   python -c "import tensorflow as tf, keras; print(tf.__version__, keras.__version__, tf.config.list_physical_devices('GPU'))"
#   -> 2.15.1 2.15.0 [PhysicalDevice(name='/physical_device:GPU:0', device_type='GPU')]
#
# Put wgrib2 in its own env (conda create -n wgrib2env -c conda-forge wgrib2) and point
# WGRIB2 at it, so installing it can't change the libraries TensorFlow uses here.
name: hrrrcast
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy<2            # TF 2.15 is built against NumPy 1.x
  - pandas
  - xarray
  - dask
  - bottleneck
  - netcdf4
  - h5netcdf
  - h5py
  - zarr
  - xesmf
  - pygrib
  - eccodes
  - grib2io
  - cf-units
  - scikit-image
  - matplotlib
  - cartopy
  - seaborn
  - joblib
  - fire
  - tqdm
  - requests
  - python-dateutil
  - libstdcxx-ng>=12   # newer C++ runtime than Grace's /lib64 (GLIBCXX_3.4.29)
  - git-lfs
  - pip
  - pip:
      - tensorflow[and-cuda]==2.15.1
      - keras==2.15.0
